<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Neon Flowers</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#02020a;
    height:100vh;
    font-family:sans-serif;
}

/* =========================
ESCENA
========================= */

.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at center,
    #130022 0%,
    #070010 35%,
    #020208 70%,
    black 100%);
}

/* =========================
NIEBLA
========================= */

.fog{
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(circle,
    rgba(0,255,255,.08),
    transparent 60%);
    animation:fogMove 20s linear infinite alternate;
    filter:blur(90px);
}

@keyframes fogMove{
    from{
        transform:translate(-10%,-10%);
    }
    to{
        transform:translate(10%,10%);
    }
}

/* =========================
PARTÍCULAS
========================= */

.particle{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:
        translateY(100vh)
        scale(0);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:
        translateY(-120vh)
        scale(1.5);
        opacity:0;
    }
}

/* =========================
LLUVIA
========================= */

.rain{
    position:absolute;
    width:2px;
    border-radius:50px;
    background:linear-gradient(
    transparent,
    rgba(0,255,255,.9));

    opacity:.5;
    animation:rain linear infinite;
}

@keyframes rain{
    from{
        transform:translateY(-120vh);
    }

    to{
        transform:translateY(120vh);
    }
}

/* =========================
SUELO
========================= */

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:180px;

    background:
    radial-gradient(circle at center,
    rgba(0,255,255,.08),
    transparent 70%),

    linear-gradient(to top,
    #020202,
    #050505);

    box-shadow:
    0 -20px 80px rgba(0,255,255,.1);
}

/* =========================
REFLEJO AGUA
========================= */

.water{
    position:absolute;
    bottom:0;
    width:100%;
    height:120px;

    background:
    linear-gradient(to top,
    rgba(0,255,255,.06),
    transparent);

    backdrop-filter:blur(5px);
}

/* =========================
PLANTA
========================= */

.plant{
    position:absolute;
    bottom:80px;
    transform-style:preserve-3d;
}

/* =========================
RAÍCES
========================= */

.root{
    position:absolute;
    bottom:-20px;
    left:50%;
    width:4px;
    height:160px;

    background:
    linear-gradient(to bottom,
    #ff00ff,
    #00ffff);

    transform-origin:top;
    border-radius:50px;

    box-shadow:
    0 0 10px #ff00ff,
    0 0 25px #00ffff;

    animation:rootGrow 5s ease forwards;
}

@keyframes rootGrow{
    from{
        height:0;
        opacity:0;
    }

    to{
        opacity:1;
    }
}

/* =========================
TALLO
========================= */

.stem{
    position:absolute;
    bottom:0;
    left:50%;
    width:8px;
    height:420px;

    border-radius:50px;

    background:
    linear-gradient(to top,
    #041,
    #0fa,
    #9ff);

    transform-origin:bottom;

    box-shadow:
    0 0 20px #00ff99,
    0 0 40px #00ff99;

    animation:stemGrow 4s ease forwards;
}

@keyframes stemGrow{
    from{
        transform:
        translateX(-50%)
        scaleY(0);
    }

    to{
        transform:
        translateX(-50%)
        scaleY(1);
    }
}

/* =========================
HOJAS
========================= */

.leaf{
    position:absolute;
    width:90px;
    height:45px;

    background:
    linear-gradient(135deg,
    #00ff99,
    #00ffff);

    border-radius:
    0 100% 0 100%;

    opacity:.9;

    box-shadow:
    0 0 20px #00ffcc;

    animation:leafGlow 4s ease-in-out infinite;
}

@keyframes leafGlow{
    0%,100%{
        filter:brightness(1);
    }

    50%{
        filter:brightness(1.5);
    }
}

/* =========================
FLOR
========================= */

.flower{
    position:absolute;
    width:220px;
    height:220px;
    left:50%;
    top:-180px;

    transform-style:preserve-3d;

    animation:
    flowerAppear 5s ease forwards,
    rotateFlower 16s linear infinite;
}

@keyframes flowerAppear{

    0%{
        opacity:0;
        transform:
        translateX(-50%)
        scale(.1)
        rotateX(90deg);
    }

    100%{
        opacity:1;
        transform:
        translateX(-50%)
        scale(1)
        rotateX(0deg);
    }
}

@keyframes rotateFlower{
    from{
        transform:
        translateX(-50%)
        rotateY(0deg);
    }

    to{
        transform:
        translateX(-50%)
        rotateY(360deg);
    }
}

/* =========================
PÉTALOS
========================= */

.petal{
    position:absolute;
    width:90px;
    height:150px;

    left:65px;
    top:20px;

    border-radius:50%;

    transform-origin:center bottom;

    opacity:.95;

    backdrop-filter:blur(2px);

    filter:
    drop-shadow(0 0 25px currentColor);
}

/* =========================
CENTRO
========================= */

.center{
    position:absolute;

    width:60px;
    height:60px;

    left:80px;
    top:80px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    #fff,
    #ffe600,
    #ff9900);

    box-shadow:
    0 0 30px #fff176,
    0 0 80px #ffeb3b,
    0 0 150px #ff9800;

    z-index:100;
}

/* =========================
BRILLOS
========================= */

.glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(255,0,255,.15),
    transparent 70%);

    filter:blur(80px);

    animation:pulse 8s infinite alternate;
}

@keyframes pulse{
    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.3);
    }
}

/* =========================
TEXTO
========================= */

.title{
    position:absolute;
    top:30px;
    width:100%;
    text-align:center;

    color:white;
    font-size:4rem;
    letter-spacing:8px;

    text-shadow:
    0 0 20px #00ffff,
    0 0 40px #ff00ff,
    0 0 80px #00ffff;

    z-index:999;
}

</style>
</head>

<body>

<div class="scene">

<div class="fog"></div>

<div class="title">
🌸 ULTRA NEON FLOWERS 🌸
</div>

<div class="glow"></div>

<!-- SUELO -->
<div class="ground"></div>
<div class="water"></div>

<!-- PLANTA -->
<div class="plant" style="left:50%;">

<!-- RAÍCES -->
<div class="root"
style="transform:rotate(-40deg);"></div>

<div class="root"
style="transform:rotate(-15deg);"></div>

<div class="root"
style="transform:rotate(15deg);"></div>

<div class="root"
style="transform:rotate(40deg);"></div>

<!-- TALLO -->
<div class="stem"></div>

<!-- HOJAS -->
<div class="leaf"
style="
left:-90px;
bottom:150px;
transform:rotate(-35deg);">
</div>

<div class="leaf"
style="
left:10px;
bottom:240px;
transform:rotate(35deg);">
</div>

<!-- FLOR -->
<div class="flower">

<div class="petal"
style="
background:
linear-gradient(to top,
#ff00ff,
#ff66ff,
#ffffff);

color:#ff00ff;

transform:
rotate(0deg)
translateY(-65px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#00ffff,
#66ffff,
#ffffff);

color:#00ffff;

transform:
rotate(45deg)
translateY(-65px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#00ff99,
#99ffcc,
#ffffff);

color:#00ff99;

transform:
rotate(90deg)
translateY(-65px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#7c4dff,
#b388ff,
#ffffff);

color:#7c4dff;

transform:
rotate(135deg)
translateY(-65px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#ff1744,
#ff8a80,
#ffffff);

color:#ff1744;

transform:
rotate(180deg)
translateY(-65px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#00e5ff,
#84ffff,
#ffffff);

color:#00e5ff;

transform:
rotate(225deg)
translateY(-65px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#76ff03,
#ccff90,
#ffffff);

color:#76ff03;

transform:
rotate(270deg)
translateY(-65px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#ff9100,
#ffd180,
#ffffff);

color:#ff9100;

transform:
rotate(315deg)
translateY(-65px);">
</div>

<div class="center"></div>

</div>
</div>

</div>

<script>

/* =========================
PARTÍCULAS
========================= */

for(let i=0;i<180;i++){

    const p=document.createElement('div');

    p.classList.add('particle');

    let size=Math.random()*4+1;

    p.style.width=size+'px';
    p.style.height=size+'px';

    p.style.left=Math.random()*100+'vw';

    p.style.background=
    ['#00ffff','#ff00ff','#ffffff','#76ff03']
    [Math.floor(Math.random()*4)];

    p.style.boxShadow=
    `0 0 15px ${p.style.background}`;

    p.style.animationDuration=
    (6+Math.random()*12)+'s';

    p.style.animationDelay=
    Math.random()*10+'s';

    document.body.appendChild(p);
}

/* =========================
LLUVIA
========================= */

for(let i=0;i<120;i++){

    const rain=document.createElement('div');

    rain.classList.add('rain');

    rain.style.left=
    Math.random()*100+'vw';

    rain.style.height=
    Math.random()*120+40+'px';

    rain.style.animationDuration=
    (.6+Math.random()*1.2)+'s';

    rain.style.animationDelay=
    Math.random()*5+'s';

    document.body.appendChild(rain);
}

</script>

</body>
</html>
