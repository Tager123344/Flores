<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FELIZ DÍA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    background:black;
    font-family:Arial, Helvetica, sans-serif;
}

/* =========================
ESCENA
========================= */

.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    background:
    radial-gradient(circle at center,
    #14001f 0%,
    #090014 35%,
    #020208 70%,
    #000 100%);
}

/* =========================
NIEBLA
========================= */

.fog{
    position:absolute;
    width:160%;
    height:160%;
    background:
    radial-gradient(circle,
    rgba(0,255,255,.08),
    transparent 60%);
    filter:blur(120px);
    animation:fogMove 20s infinite alternate;
}

@keyframes fogMove{
    from{
        transform:translate(-10%,-5%);
    }
    to{
        transform:translate(10%,5%);
    }
}

/* =========================
PARTÍCULAS
========================= */

.particle{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    animation:float linear infinite;
}

@keyframes float{

    from{
        transform:
        translateY(100vh)
        scale(0);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:
        translateY(-120vh)
        scale(1.5);
        opacity:0;
    }
}

/* =========================
SUELO
========================= */

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:180px;

    background:
    linear-gradient(to top,
    rgba(0,0,0,.95),
    rgba(0,0,0,.4));

    box-shadow:
    inset 0 10px 60px rgba(0,255,255,.08);
}

/* =========================
ONDAS AGUA
========================= */

.ripple{
    position:absolute;
    border:1px solid rgba(0,255,255,.12);
    border-radius:50%;
    animation:ripple 5s linear infinite;
}

@keyframes ripple{

    from{
        transform:scale(.2);
        opacity:.8;
    }

    to{
        transform:scale(3);
        opacity:0;
    }
}

/* =========================
PLANTA
========================= */

.plant{
    position:absolute;
    left:50%;
    bottom:130px;

    transform:translateX(-50%);
}

/* =========================
RAÍCES
========================= */

.root{
    position:absolute;
    bottom:-30px;
    left:0;

    width:4px;
    height:180px;

    border-radius:50px;

    background:
    linear-gradient(to bottom,
    #ff00ff,
    #00ffff);

    opacity:.8;

    transform-origin:top;

    box-shadow:
    0 0 10px #ff00ff,
    0 0 20px #00ffff;

    animation:rootGrow 3s ease forwards;
}

@keyframes rootGrow{

    from{
        height:0;
        opacity:0;
    }

    to{
        opacity:.8;
    }
}

/* =========================
TALLO
========================= */

.stem{
    position:absolute;
    left:50%;
    bottom:0;

    width:8px;
    height:0;

    border-radius:50px;

    background:
    linear-gradient(to top,
    #063,
    #00ff99,
    #b2ffda);

    transform:translateX(-50%);

    box-shadow:
    0 0 20px #00ff99,
    0 0 40px #00ff99;

    animation:stemGrow 3s ease forwards;
    animation-delay:2.2s;
}

@keyframes stemGrow{

    from{
        height:0;
    }

    to{
        height:300px;
    }
}

/* =========================
HOJAS
========================= */

.leaf{
    position:absolute;

    width:80px;
    height:40px;

    border-radius:
    0 100% 0 100%;

    background:
    linear-gradient(135deg,
    rgba(0,255,120,.9),
    rgba(0,255,255,.7));

    box-shadow:
    0 0 20px rgba(0,255,150,.8);

    opacity:0;

    animation:leafAppear 2s ease forwards;
    animation-delay:4s;
}

@keyframes leafAppear{

    from{
        opacity:0;
        transform:scale(0);
    }

    to{
        opacity:1;
    }
}

/* =========================
FLOR
========================= */

.flower{
    position:absolute;

    width:180px;
    height:180px;

    left:50%;
    top:-150px;

    transform:
    translateX(-50%) scale(0);

    animation:
    flowerAppear 3s ease forwards;

    animation-delay:4.5s;
}

@keyframes flowerAppear{

    from{
        transform:
        translateX(-50%)
        scale(0)
        rotate(-30deg);

        opacity:0;
    }

    to{
        transform:
        translateX(-50%)
        scale(1)
        rotate(0deg);

        opacity:1;
    }
}

/* =========================
PÉTALOS
========================= */

.petal{
    position:absolute;

    width:70px;
    height:110px;

    left:55px;
    top:20px;

    border-radius:50%;

    transform-origin:center bottom;

    overflow:hidden;

    opacity:.95;
}

.petal::before{

    content:"";

    position:absolute;
    inset:0;

    background:
    radial-gradient(circle at top,
    rgba(255,255,255,.9),
    transparent 40%);
}

/* =========================
CENTRO
========================= */

.center{
    position:absolute;

    width:50px;
    height:50px;

    left:65px;
    top:65px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    #fff,
    #ffd000,
    #ff8800);

    z-index:10;

    box-shadow:
    0 0 20px #ffd000,
    0 0 60px #ff8800;
}

/* =========================
TEXTO
========================= */

.title{
    position:absolute;
    top:30px;
    width:100%;
    text-align:center;

    color:white;

    font-size:4rem;
    letter-spacing:8px;

    text-shadow:
    0 0 20px #00ffff,
    0 0 40px #ff00ff,
    0 0 100px #00ffff;

    z-index:999;
}

</style>
</head>

<body>

<div class="scene">

<div class="fog"></div>

<div class="title">
🌸 FELIZ DÍA 🌸
</div>

<div class="ground"></div>

<!-- ONDAS -->
<div class="ripple"
style="
width:120px;
height:120px;
left:50%;
bottom:40px;">
</div>

<div class="ripple"
style="
width:200px;
height:200px;
left:47%;
bottom:10px;
animation-delay:2s;">
</div>

<!-- PLANTA -->
<div class="plant">

<!-- RAÍCES -->
<div class="root"
style="
transform:rotate(-45deg);">
</div>

<div class="root"
style="
transform:rotate(-15deg);">
</div>

<div class="root"
style="
transform:rotate(15deg);">
</div>

<div class="root"
style="
transform:rotate(45deg);">
</div>

<!-- TALLO -->
<div class="stem"></div>

<!-- HOJAS -->
<div class="leaf"
style="
left:-85px;
top:120px;
transform:rotate(-30deg);">
</div>

<div class="leaf"
style="
left:10px;
top:80px;
transform:rotate(35deg);">
</div>

<!-- FLOR -->
<div class="flower">

<div class="petal"
style="
background:
linear-gradient(to top,
#ff00ff,
#ff99ff,
#ffffff);

box-shadow:
0 0 25px #ff00ff;

transform:
rotate(0deg)
translateY(-55px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#00ffff,
#99ffff,
#ffffff);

box-shadow:
0 0 25px #00ffff;

transform:
rotate(60deg)
translateY(-55px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#76ff03,
#ccff90,
#ffffff);

box-shadow:
0 0 25px #76ff03;

transform:
rotate(120deg)
translateY(-55px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#ff9100,
#ffd180,
#ffffff);

box-shadow:
0 0 25px #ff9100;

transform:
rotate(180deg)
translateY(-55px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#7c4dff,
#c2a1ff,
#ffffff);

box-shadow:
0 0 25px #7c4dff;

transform:
rotate(240deg)
translateY(-55px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#00ff99,
#99ffcc,
#ffffff);

box-shadow:
0 0 25px #00ff99;

transform:
rotate(300deg)
translateY(-55px);">
</div>

<div class="center"></div>

</div>

</div>

</div>

<script>

/* PARTÍCULAS */

for(let i=0;i<180;i++){

    const p=document.createElement('div');

    p.classList.add('particle');

    let size=Math.random()*4+1;

    p.style.width=size+'px';
    p.style.height=size+'px';

    p.style.left=Math.random()*100+'vw';

    let colors=[
    '#00ffff',
    '#ff00ff',
    '#ffffff',
    '#76ff03'
    ];

    let c=
    colors[Math.floor(Math.random()*colors.length)];

    p.style.background=c;

    p.style.boxShadow=
    `0 0 15px ${c}`;

    p.style.animationDuration=
    (8+Math.random()*14)+'s';

    p.style.animationDelay=
    Math.random()*8+'s';

    document.body.appendChild(p);
}

</script>

</body>
</html>
