<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FELIZ DÍA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    height:100vh;
    font-family:Arial, Helvetica, sans-serif;
}

/* =========================
ESCENA
========================= */

.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    background:
    radial-gradient(circle at center,
    #14001f 0%,
    #090014 30%,
    #020208 60%,
    #000 100%);
}

/* =========================
NIEBLA PROFUNDA
========================= */

.fog1,
.fog2,
.fog3{
    position:absolute;
    width:200%;
    height:200%;
    border-radius:50%;
    filter:blur(120px);
    mix-blend-mode:screen;
}

.fog1{
    background:
    radial-gradient(circle,
    rgba(0,255,255,.10),
    transparent 60%);

    animation:fogMove1 20s infinite alternate;
}

.fog2{
    background:
    radial-gradient(circle,
    rgba(255,0,255,.10),
    transparent 60%);

    animation:fogMove2 30s infinite alternate;
}

.fog3{
    background:
    radial-gradient(circle,
    rgba(0,255,100,.07),
    transparent 60%);

    animation:fogMove3 25s infinite alternate;
}

@keyframes fogMove1{
    from{ transform:translate(-10%,-5%);}
    to{ transform:translate(10%,5%);}
}

@keyframes fogMove2{
    from{ transform:translate(10%,-10%);}
    to{ transform:translate(-10%,10%);}
}

@keyframes fogMove3{
    from{ transform:translate(0%,-10%);}
    to{ transform:translate(5%,10%);}
}

/* =========================
SUELO / AGUA
========================= */

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:220px;

    background:
    linear-gradient(to top,
    rgba(0,0,0,.95),
    rgba(0,0,0,.5));

    backdrop-filter:blur(5px);

    box-shadow:
    inset 0 20px 80px rgba(0,255,255,.05);
}

/* =========================
REFLEJO AGUA
========================= */

.water-reflection{
    position:absolute;
    bottom:0;
    width:100%;
    height:160px;

    background:
    linear-gradient(to top,
    rgba(0,255,255,.06),
    transparent);

    opacity:.8;
}

/* =========================
ONDAS
========================= */

.ripple{
    position:absolute;
    border:2px solid rgba(0,255,255,.15);
    border-radius:50%;
    animation:ripple 4s linear infinite;
}

@keyframes ripple{

    from{
        transform:scale(.2);
        opacity:.8;
    }

    to{
        transform:scale(3);
        opacity:0;
    }
}

/* =========================
PARTÍCULAS
========================= */

.particle{
    position:absolute;
    border-radius:50%;
    animation:float linear infinite;
    pointer-events:none;
}

@keyframes float{

    from{
        transform:
        translateY(100vh)
        translateX(0px)
        scale(0);

        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:
        translateY(-120vh)
        translateX(40px)
        scale(1.8);

        opacity:0;
    }
}

/* =========================
LLUVIA
========================= */

.rain{
    position:absolute;
    width:2px;

    background:
    linear-gradient(
    transparent,
    rgba(0,255,255,.9));

    border-radius:50px;

    opacity:.5;

    animation:rain linear infinite;
}

@keyframes rain{

    from{
        transform:translateY(-120vh);
    }

    to{
        transform:translateY(120vh);
    }
}

/* =========================
PLANTA
========================= */

.plant{
    position:absolute;
    left:50%;
    bottom:120px;

    transform:
    translateX(-50%);

    animation:
    plantFloat 6s ease-in-out infinite;
}

@keyframes plantFloat{

    0%,100%{
        transform:
        translateX(-50%)
        translateY(0px);
    }

    50%{
        transform:
        translateX(-50%)
        translateY(-12px);
    }
}

/* =========================
RAÍCES
========================= */

.root{
    position:absolute;
    bottom:-40px;
    left:0;

    height:220px;
    border-radius:50px;

    background:
    linear-gradient(to bottom,
    #ff00ff,
    #00ffff);

    transform-origin:top;

    filter:
    blur(.3px)
    drop-shadow(0 0 12px #ff00ff);

    opacity:.8;
}

/* =========================
TALLO
========================= */

.stem{
    position:absolute;
    left:50%;
    bottom:0;

    width:10px;
    height:420px;

    border-radius:100px;

    background:
    linear-gradient(to top,
    #042,
    #00ff99,
    #ccffcc);

    transform:
    translateX(-50%);

    box-shadow:
    0 0 25px #00ff99,
    0 0 60px #00ff99;
}

/* =========================
RAMAS
========================= */

.branch{
    position:absolute;
    width:6px;
    height:120px;

    border-radius:50px;

    background:
    linear-gradient(to top,
    #00ff99,
    #99ffee);

    box-shadow:
    0 0 18px #00ff99;
}

/* =========================
HOJAS
========================= */

.leaf{
    position:absolute;

    width:120px;
    height:60px;

    border-radius:
    0 100% 0 100%;

    overflow:hidden;

    background:
    linear-gradient(135deg,
    rgba(0,255,120,.9),
    rgba(0,255,255,.7));

    box-shadow:
    0 0 25px rgba(0,255,150,.8);

    backdrop-filter:blur(2px);

    opacity:.95;
}

.leaf::after{

    content:"";

    position:absolute;
    inset:0;

    background:
    linear-gradient(to right,
    transparent,
    rgba(255,255,255,.5),
    transparent);

    transform:rotate(25deg);
}

/* =========================
FLOR
========================= */

.flower{
    position:absolute;

    width:320px;
    height:320px;

    left:50%;
    top:-240px;

    transform:
    translateX(-50%);

    animation:
    flowerBreath 8s ease-in-out infinite;
}

@keyframes flowerBreath{

    0%,100%{
        transform:
        translateX(-50%)
        scale(1)
        rotate(0deg);
    }

    50%{
        transform:
        translateX(-50%)
        scale(1.03)
        rotate(2deg);
    }
}

/* =========================
PÉTALOS
========================= */

.petal{
    position:absolute;

    width:120px;
    height:180px;

    left:100px;
    top:40px;

    border-radius:
    50% 50% 45% 45%;

    transform-origin:center bottom;

    backdrop-filter:blur(3px);

    opacity:.95;

    overflow:hidden;
}

.petal::before{

    content:"";

    position:absolute;
    inset:0;

    background:
    radial-gradient(circle at top,
    rgba(255,255,255,.95),
    transparent 40%);

    mix-blend-mode:screen;
}

.petal::after{

    content:"";

    position:absolute;
    inset:0;

    background:
    linear-gradient(to bottom,
    transparent,
    rgba(255,255,255,.3));

    filter:blur(12px);
}

/* =========================
CENTRO
========================= */

.center{
    position:absolute;

    width:80px;
    height:80px;

    left:120px;
    top:120px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    #fff,
    #ffe600,
    #ff8800);

    z-index:50;

    box-shadow:
    0 0 30px #fff176,
    0 0 80px #ffeb3b,
    0 0 180px #ff9800;
}

/* =========================
ESTAMBRES
========================= */

.stamen{
    position:absolute;

    width:2px;
    height:60px;

    background:white;

    left:159px;
    top:110px;

    transform-origin:bottom;

    opacity:.9;

    box-shadow:
    0 0 10px white;
}

.stamen::after{

    content:"";

    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#fff;

    top:-4px;
    left:-3px;

    box-shadow:
    0 0 12px white;
}

/* =========================
TEXTO
========================= */

.title{
    position:absolute;
    top:30px;

    width:100%;
    text-align:center;

    font-size:4rem;
    letter-spacing:8px;

    color:white;

    text-shadow:
    0 0 20px #00ffff,
    0 0 40px #ff00ff,
    0 0 120px #00ffff;

    z-index:999;
}

</style>
</head>

<body>

<div class="scene">

<div class="fog1"></div>
<div class="fog2"></div>
<div class="fog3"></div>

<div class="title">
🌸 FELIZ DÍA 🌸
</div>

<div class="ground"></div>
<div class="water-reflection"></div>

<div class="ripple"
style="
width:120px;
height:120px;
left:50%;
bottom:40px;">
</div>

<div class="ripple"
style="
width:180px;
height:180px;
left:48%;
bottom:20px;
animation-delay:2s;">
</div>

<div class="plant">

<div class="root"
style="
width:5px;
transform:
rotate(-55deg);">
</div>

<div class="root"
style="
width:4px;
transform:
rotate(-25deg);">
</div>

<div class="root"
style="
width:6px;
transform:
rotate(20deg);">
</div>

<div class="root"
style="
width:4px;
transform:
rotate(50deg);">
</div>

<div class="stem"></div>

<div class="branch"
style="
left:-40px;
top:160px;
transform:
rotate(-35deg);">
</div>

<div class="branch"
style="
left:40px;
top:90px;
transform:
rotate(35deg);">
</div>

<div class="leaf"
style="
left:-150px;
top:180px;
transform:
rotate(-25deg);">
</div>

<div class="leaf"
style="
left:30px;
top:110px;
transform:
rotate(35deg);">
</div>

<!-- FLOR CORREGIDA -->
<div class="flower">

<div class="petal"
style="
background:
linear-gradient(to top,
#ff00ff,
#ff66ff,
#ffffff);

box-shadow:
0 0 30px #ff00ff;

transform:
rotate(0deg)
translateY(90px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#00ffff,
#66ffff,
#ffffff);

box-shadow:
0 0 30px #00ffff;

transform:
rotate(45deg)
translateY(90px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#7c4dff,
#c2a1ff,
#ffffff);

box-shadow:
0 0 30px #7c4dff;

transform:
rotate(90deg)
translateY(90px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#00ff99,
#99ffcc,
#ffffff);

box-shadow:
0 0 30px #00ff99;

transform:
rotate(135deg)
translateY(90px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#ff1744,
#ff8a80,
#ffffff);

box-shadow:
0 0 30px #ff1744;

transform:
rotate(180deg)
translateY(90px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#00e5ff,
#84ffff,
#ffffff);

box-shadow:
0 0 30px #00e5ff;

transform:
rotate(225deg)
translateY(90px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#76ff03,
#ccff90,
#ffffff);

box-shadow:
0 0 30px #76ff03;

transform:
rotate(270deg)
translateY(90px);">
</div>

<div class="petal"
style="
background:
linear-gradient(to top,
#ff9100,
#ffd180,
#ffffff);

box-shadow:
0 0 30px #ff9100;

transform:
rotate(315deg)
translateY(90px);">
</div>

<div class="center"></div>

</div>

</div>

</div>

<script>

for(let i=0;i<26;i++){

    let s=document.createElement('div');

    s.classList.add('stamen');

    s.style.transform=
    `rotate(${i*14}deg)`;

    document.querySelector('.flower')
    .appendChild(s);
}

for(let i=0;i<250;i++){

    const p=document.createElement('div');

    p.classList.add('particle');

    let size=Math.random()*5+1;

    p.style.width=size+'px';
    p.style.height=size+'px';

    p.style.left=Math.random()*100+'vw';

    let colors=[
    '#00ffff',
    '#ff00ff',
    '#ffffff',
    '#76ff03',
    '#ff8800'
    ];

    let c=
    colors[Math.floor(Math.random()*colors.length)];

    p.style.background=c;

    p.style.boxShadow=
    `0 0 18px ${c}`;

    p.style.animationDuration=
    (8+Math.random()*18)+'s';

    p.style.animationDelay=
    Math.random()*10+'s';

    p.style.filter=
    `blur(${Math.random()*1.5}px)`;

    document.body.appendChild(p);
}

for(let i=0;i<180;i++){

    const rain=document.createElement('div');

    rain.classList.add('rain');

    rain.style.left=
    Math.random()*100+'vw';

    rain.style.height=
    Math.random()*140+40+'px';

    rain.style.animationDuration=
    (.5+Math.random()*1.2)+'s';

    rain.style.animationDelay=
    Math.random()*5+'s';

    rain.style.opacity=
    Math.random()*.5+.1;

    document.body.appendChild(rain);
}

</script>

</body>
</html>
